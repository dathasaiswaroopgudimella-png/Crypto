[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronis-sprint16"
version = "1.0.0"
description = "CHRONIS AI/ML Sprint 16: Trust-Boundary Hardening (T16.1 - T16.7)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=46.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = ["isolation", "kdf", "unlinkability", "bystander_ttl", "license_gate", "benchmarks"]
